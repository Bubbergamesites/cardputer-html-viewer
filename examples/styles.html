<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Showcase</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }
        .card {
            background-color: white;
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .card h3 {
            margin: 0 0 5px 0;
            color: #667eea;
        }
        .card p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CSS Styling Demo</h1>
    </div>
    
    <div class="card">
        <h3>Feature 1</h3>
        <p>Beautiful gradient backgrounds and card layouts</p>
    </div>
    
    <div class="card">
        <h3>Feature 2</h3>
        <p>Responsive design for CardPuter display</p>
    </div>
    
    <div class="card">
        <h3>Feature 3</h3>
        <p>Modern styling with shadows and effects</p>
    </div>
</body>
</html>
