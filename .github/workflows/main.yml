name: Build Firmware

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyserial esptool

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Update Arduino CLI core index
        run: arduino-cli core update-index

      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install M5Stack libraries
        run: |
          arduino-cli lib install M5CardPuter
          arduino-cli lib install M5Unified
          arduino-cli lib install M5Stack-Avatar

      - name: Create build directory
        run: mkdir -p build

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:m5stack_cardputer \
            --output-dir ./build \
            --build-properties build.partitions=default \
            ./app

      - name: List compiled output
        run: ls -lah build/

      - name: Rename binary
        run: |
          cd build
          for file in *.bin; do
            if [ -f "$file" ]; then
              mv "$file" "cardputer-firmware.bin"
            fi
          done

      - name: Generate firmware info
        run: |
          echo "# Firmware Build Info" > build/BUILD_INFO.md
          echo "**Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> build/BUILD_INFO.md
          echo "**Commit:** ${{ github.sha }}" >> build/BUILD_INFO.md
          echo "**Branch:** ${{ github.ref_name }}" >> build/BUILD_INFO.md
          cat build/BUILD_INFO.md

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-firmware
          path: build/
          retention-days: 30

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/cardputer-firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build completion
        run: echo "✅ Firmware build completed successfully!"
